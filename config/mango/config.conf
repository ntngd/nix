var=term,ghostty
var=launcher,fuzzel

exec_once=mangobar
exec_once=mako
#exec_once=swww-daemon
exec_once=swaybg -i /home/kb/Pictures/w1.jpg -m fill
#exec_once=/run/current-system/sw/libexec/hyprpolkitagent
exec_once=lxqt-policykit-agent
exec_once= dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots

#monitor=,preferred,auto,1
monitor_rule=name:HDMI-A-1,scale:1.5,hdr:1,primary:1
monitor_rule=name:HDMI-A-2,scale:1.5,hdr:1
#gaps_in=5
#gaps_out=10

animations=1
#corner_radius=10


#Blur
blur=0
blur_layer=1
blur_optimized=1

#Dimensionts
border_px=2

#Colors
focus_color=0xFFC067FF

#Cursor
cursor_size=34
cursor_theme=Adwaita


shadows=1
layer_shadows=1
# shadows_size=12
# shadows_blur=15
shadows_size=8
shadows_blur=50
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ff

border_radius=4
focused_opacity=1.0
unfocused_opacity=0.95


circle_layout=tile,scroller,monocle
default_master_factor=0.55
new_is_master=1


bind=SUPER,m,quit
bind=SUPER,r,reload_config
bind=SUPER,q,killclient


bind=SUPER,Return,spawn,$term
bind=SUPER,space,spawn,$launcher

bind=SUPER,Tab,switch_layout
#bind=SUPER,f,toggle_fullscreen
#bind=SUPER,v,toggle_floating

bind=SUPER,left,focusmon,left
bind=SUPER,right,focusmon,right
bind=SUPER,up,tagmon,right
bind=SUPER,down,tagmon,left

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,right,exchange_client,right
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,down,exchange_client,down

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5

bind=SUPER,Escape,spawn,wlogout -b 5 -c 0 -r 0

# --- Audio Volume Controls (via pamixer) ---
# Raise Volume (5% step)
bind = NONE, XF86AudioRaiseVolume, spawn, pamixer -i 5

# Lower Volume (5% step)
bind =NONE, XF86AudioLowerVolume, spawn, pamixer -d 5

# Mute / Unmute Output
bind =NONE, XF86AudioMute, spawn, pamixer -t

# Mute / Unmute Microphone
bind =NONE, XF86AudioMicMute, spawn, pamixer --default-source -t

# --- Media Playback Controls (via playerctl) ---
bind =NONE, XF86AudioPlay, spawn, playerctl play-pause
bind =NONE, XF86AudioNext, spawn, playerctl next
bind =NONE, XF86AudioPrev, spawn, playerctl previous

# --- Open GUI Volume Mixer (Super + Alt + V) ---
bind = SUPER+ALT, V, spawn, pavucontrol

# Mango WM window rule syntax:
window_rule = app_id:steam,is_floating:1

# Or target specific Steam popup titles:
window_rule = app_id:steam,title:^(Friends List|Steam - News|Steam Guard|Settings)$,is_floating:1
